[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitld-addon-vosk"
version = "1.0.1"
description = "Subtitld add-on: offline ASR via Vosk"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Subtitld", email = "jbopen@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
    "vosk>=0.3.44",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]
dev = [
    "pytest>=7.4",
]

[project.scripts]
vosk-addon = "vosk_addon.__main__:main"

[tool.setuptools]
packages = ["vosk_addon"]
