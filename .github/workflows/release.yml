name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Build per-platform PyInstaller bundles, package each into a release zip
# matching Subtitld's add-on naming convention, and (on tag push) attach
# them to a GitHub Release. The release artefacts are also referenced by
# the Subtitld catalog (https://subtitld.github.io/addons-catalog) — when
# this workflow uploads, the catalog repo's update workflow picks the new
# release up via the GitHub API.

permissions:
  contents: write   # needed to create the release on tag push

jobs:
  build:
    name: Build ${{ matrix.platform_label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform_label: linux-x86_64
            platform: linux
            arch: x86_64
            archive_ext: zip
          - os: macos-14   # arm64 runners
            platform_label: macos-arm64
            platform: macos
            arch: arm64
            archive_ext: zip
          - os: macos-13   # last x86_64-native macOS runner
            platform_label: macos-x86_64
            platform: macos
            arch: x86_64
            archive_ext: zip
          - os: windows-2022
            platform_label: windows-x86_64
            platform: windows
            arch: x86_64
            archive_ext: zip

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[build]'

      - name: Build PyInstaller bundle
        shell: bash
        run: |
          pyinstaller pyinstaller.spec --noconfirm

      - name: Stage release archive
        shell: bash
        run: |
          set -euo pipefail
          # Read the manifest version so the archive name and the manifest
          # never drift out of sync — bumping `manifest.json:version` is
          # all that's needed for a new release.
          version=$(python -c "import json; print(json.load(open('manifest.json'))['version'])")
          stage="release-staging/vosk-addon"
          rm -rf release-staging
          mkdir -p "$stage"
          # PyInstaller --onedir output → goes inside the addon's root.
          cp -r dist/vosk-addon/. "$stage/"
          cp manifest.json LICENSE README.md "$stage/"
          archive_name="org.subtitld.vosk-${version}-${{ matrix.platform_label }}.zip"
          ( cd release-staging && \
            python -c "import shutil; shutil.make_archive('../$archive_name'.removesuffix('.zip'), 'zip', '.', 'vosk-addon')" )
          ls -lah "$archive_name"
          echo "ARCHIVE_NAME=$archive_name" >> "$GITHUB_ENV"

      - name: Compute checksum
        shell: bash
        run: |
          python -c "import hashlib, sys; print(hashlib.sha256(open('${ARCHIVE_NAME}','rb').read()).hexdigest())" \
            > "${ARCHIVE_NAME}.sha256"
          cat "${ARCHIVE_NAME}.sha256"

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform_label }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Fetch all built artefacts
        uses: actions/download-artifact@v4
        with:
          path: artefacts

      - name: Flatten layout
        shell: bash
        run: |
          mkdir -p release-files
          find artefacts -type f -name 'org.subtitld.vosk-*' -print -exec cp {} release-files/ \;
          ls -lah release-files

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          fail_on_unmatched_files: true
